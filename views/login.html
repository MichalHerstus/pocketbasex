<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>

    :root {
      --body-bg: #989e9b;
      --card-bg: #a15454;
      --card-shadow: 0 16px 32px rgba(0, 0, 0, 0.08);
      --input-border: #0c0c75;
      --primary: #6a6d72;
      --primary-foreground: #dbc158;
      --surface: #3b63b2;
      --surface-foreground: #111827;
}
      body { font-family: sans-serif; background: var(--body-bg); margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .login-card { background: var(--primary); padding: 24px; border-radius: 12px; box-shadow: var(--card-shadow); width: min(400px, 90vw); }
      .login-card h1 { margin-top: 0; font-size: 1.5rem; }
      .login-card label { display: block; margin-top: 16px; font-weight: 600; }
      .login-card input { width: 100%; padding: 10px 12px; margin-top: 8px; border: 1px solid var(--input-border); border-radius: 8px; box-sizing: border-box; }
      .login-card .actions { display: flex; gap: 12px; margin-top: 24px; }
      .login-card button { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
      .login-card button[type="submit"] { background: var(--primary); color: var(--primary-foreground); }
      .login-card button[type="reset"] { background: var(--surface); color: var(--surface-foreground); }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1>Login</h1>
      <form method="post" action="/login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required />

        <div class="actions">
          <button type="submit">Submit</button>
          <button type="reset">Reset form</button>
        </div>
      </form>
    </div>
  </body>
</html>
