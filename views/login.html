<!DOCTYPE html>
<html lang="{{.Lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{t .Lang "login.title"}} - PBX</title>
    <style>
      :root {
        --body-bg: #f8f9fb;
        --card-bg: #fff;
        --card-shadow: 0 16px 40px rgba(0,0,0,0.08);
        --input-border: #d8dde6;
        --primary: #2b79ff;
        --primary-hover: #1a5fd6;
        --primary-foreground: #fff;
        --surface: #e9ecef;
        --surface-foreground: #333;
        --error: #c00;
      }
      * { box-sizing: border-box; }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--body-bg);
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-card {
        background: var(--card-bg);
        padding: 32px 28px;
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        width: min(400px, 90vw);
      }
      .login-card h1 {
        margin: 0 0 8px 0;
        font-size: 1.5rem;
        color: #222;
        text-align: center;
      }
      .login-card p.subtitle {
        margin: 0 0 24px 0;
        color: #666;
        text-align: center;
        font-size: 0.9rem;
      }
      .login-card label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
        color: #333;
      }
      .login-card input {
        width: 100%;
        padding: 10px 12px;
        margin-top: 8px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 0.95rem;
        outline: none;
      }
      .login-card input:focus {
        border-color: var(--primary);
      }
      .login-card .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .login-card button {
        flex: 1;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
      }
      .login-card button[type="submit"] {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .login-card button[type="submit"]:hover {
        background: var(--primary-hover);
      }
      .login-card button[type="reset"] {
        background: var(--surface);
        color: var(--surface-foreground);
      }
      .login-card button[type="reset"]:hover {
        background: #d3d7db;
      }
      .error {
        color: var(--error);
        text-align: center;
        margin: 12px 0 0 0;
        font-size: 0.9rem;
      }
    </style>
    <link rel="stylesheet" href="/assets/theme.css">
  </head>
  <body data-theme="{{.Theme}}">
    <button type="button" id="themeBtn" onclick="toggleTheme()" style="position:fixed;top:16px;right:16px;padding:8px 12px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:1.1rem;cursor:pointer;z-index:10;">🌙</button>
    <button type="button" onclick="toggleLang()" style="position:fixed;top:16px;right:76px;padding:8px 12px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;z-index:10;">{{if eq .Lang "cs"}}EN{{else}}CS{{end}}</button>
    <div class="login-card">
      <h1>{{t .Lang "login.title"}}</h1>
      <p class="subtitle">{{t .Lang "login.subtitle"}}</p>
      <form method="post" action="/login">
        <label for="name">{{t .Lang "login.name"}}</label>
        <input id="name" name="name" type="text" placeholder="your@email.com" required autofocus />

        <label for="password">{{t .Lang "login.password"}}</label>
        <input id="password" name="password" type="password" placeholder="{{t .Lang "login.password"}}" required />

        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}

        <div class="actions">
          <button type="submit">{{t .Lang "login.submit"}}</button>
          <button type="reset">{{t .Lang "common.cancel"}}</button>
        </div>
      </form>
    </div>
    <script>
      function toggleLang() {
        var next = document.documentElement.lang === 'cs' ? 'en' : 'cs';
        var d = new Date(); d.setTime(d.getTime() + 365*24*3600*1000);
        document.cookie = 'pb_lang=' + next + ';path=/;expires=' + d.toUTCString();
        fetch('/api/lang/' + next, { method: 'POST' }).catch(function(){});
        window.location.reload();
      }
      function currentTheme() {
        var t = localStorage.getItem('pbx-theme');
        if (t === 'dark' || t === 'light') return t;
        return document.body.getAttribute('data-theme') || 'light';
      }
      function applyTheme(mode) {
        document.body.setAttribute('data-theme', mode);
        var btn = document.getElementById('themeBtn');
        if (btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
      }
      function toggleTheme() {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        localStorage.setItem('pbx-theme', next);
        applyTheme(next);
        fetch('/api/theme/' + next, { method: 'POST' }).catch(function(){});
      }
      applyTheme(currentTheme());
    </script>
  </body>
</html>
