<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI agent</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: var(--body-bg, #f5f5f5); color: #333; height: 100vh; display: flex; flex-direction: column; }
        h1 { margin: 0; font-size: 1.4rem; }
        .topbar { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .topbar .title { font-weight: 600; }
        .topbar .status { font-size: .8rem; color: #888; }
        .topbar .status.bad { color: #d33; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: .9rem; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: var(--msg-user-bg, #dbeafe); }
        .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; }
        .msg.tool { align-self: center; background: #fff8e1; border: 1px solid #e0c46a; font-size: .85rem; }
        .msg.err { align-self: center; background: #fdecea; border: 1px solid #e0a0a0; color: #a33; }
        .msg code { background: #f0f2f5; border: 1px solid #e0e0e0; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.tbl { align-self: flex-start; max-width: 95%; padding: 0; overflow: auto; max-height: 320px; }
        .msg.tbl table { width: max-content; min-width: 100%; border-collapse: collapse; background: var(--card-bg, #fff); border-radius: 8px; font-size: .85rem; }
        .msg.tbl th, .msg.tbl td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
        .msg.tbl th { position: sticky; top: 0; z-index: 1; background: #fafafa; font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color: #555; user-select: none; }
        .msg.tbl tr:hover td { background: #f0f7ff; }
        .msg.rich { align-self: flex-start; max-width: 95%; padding: 12px 14px; background: var(--card-bg, #fff); border: 1px solid #e0e0e0; border-radius: 10px; overflow: auto; }
        .msg.rich .ai-md { font-size: .9rem; line-height: 1.45; color: var(--text, #333); }
        .msg.rich .ai-md p { margin: 0 0 8px 0; }
        .msg.rich .ai-md ul, .msg.rich .ai-md ol { margin: 0 0 8px 0; padding-left: 20px; }
        .msg.rich .ai-md pre { background: #f6f8fa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: .82rem; }
        .msg.rich .ai-md code { background: #f0f2f5; border: 1px solid #e0e0e0; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.rich .ai-md pre code { background: none; border: none; padding: 0; }
        .msg.rich .ai-md a { color: var(--accent, #007bff); }
        .msg.rich .ai-md blockquote { margin: 0 0 8px 0; padding: 0 12px; border-left: 3px solid var(--border2, #88bda4); color: var(--muted, #666); }
        .msg.rich .ai-md h1, .msg.rich .ai-md h2, .msg.rich .ai-md h3 { margin: 10px 0 6px 0; font-size: 1.05rem; }
        .msg.rich .ai-md table { border-collapse: collapse; margin: 0 0 8px 0; font-size: .85rem; }
        .msg.rich .ai-md th, .msg.rich .ai-md td { padding: 5px 10px; border: 1px solid var(--border, #eee); }
        .msg.rich .ai-tbl { overflow-x: auto; margin-top: 2px; }
        .msg.rich .ai-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .85rem; }
        .msg.rich .ai-table th, .msg.rich .ai-table td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border, #eee); white-space: nowrap; }
        .msg.rich .ai-table th { background: var(--card2-bg, #fafafa); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted, #555); }
        .msg.rich .ai-table tr:hover td { background: var(--row-hover, #f0f7ff); }
        .msg.rich .ai-detail { font-size: .9rem; }
        .msg.rich .ai-detail-title { font-weight: 600; font-size: 1rem; margin-bottom: 6px; color: var(--text, #333); }
        .msg.rich .ai-detail dl { margin: 0; display: grid; grid-template-columns: minmax(120px, 1fr) 3fr; gap: 4px 12px; }
        .msg.rich .ai-detail dt { color: var(--muted, #555); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
        .msg.rich .ai-detail dd { margin: 0; padding: 1px 0; word-break: break-word; }
        .msg.rich .ai-detail dd code { background: #f0f2f5; border: 1px solid #e0e0e0; border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .inputbar { padding: 12px 20px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; align-items: center; }
        .inputbar input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: .9rem; outline: none; }
        .inputbar button { padding: 10px 16px; border: none; border-radius: 6px; font-size: .9rem; cursor: pointer; }
        .btn-primary { background: var(--btn-primary, #007bff); color: #fff; }
        .btn-neutral { background: var(--btn-neutral, #6c757d); color: #fff; }
        .filechip { display: inline-flex; align-items: center; gap: 6px; background: #eef2f7; border: 1px solid #ccc; border-radius: 6px; padding: 4px 8px; font-size: .8rem; }
        .filechip .x { cursor: pointer; color: #888; font-weight: 700; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 10px; padding: 20px; max-width: 560px; width: 92%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 8px 0; }
        .modal .summary { font-size: .95rem; font-weight: 600; margin-bottom: 12px; }
        .modal pre { background: #f6f8fa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; font-size: .8rem; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
        .modal .actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
        .modal .actions button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
        .modal .actions .approve { background: #28a745; color: #fff; }
        .modal .actions .reject { background: #dc3545; color: #fff; }
        .spinner { display: none; font-size: .85rem; color: var(--muted, #888); padding: 8px 20px; align-items: center; }
        .spinner.show { display: flex; }
        .spinner .d { display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite ease-in-out; }
        .spinner .d:nth-of-type(2) { animation-delay: .15s; }
        .spinner .d:nth-of-type(3) { animation-delay: .3s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }
        #spinTime { margin-left: 6px; font-variant-numeric: tabular-nums; }
    </style>
    <link rel="stylesheet" href="/assets/theme.css">
</head>
<body data-theme="{{.Theme}}">
    <div class="topbar">
        <button type="button" id="themeBtn" onclick="toggleTheme()" style="padding:8px 12px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:1.1rem;cursor:pointer;">🌙</button>
        <span class="title">AI agent</span>
        <span id="status" class="status {{if not .Config.Enabled}}bad{{end}}">{{.Status}}</span>
        <button type="button" onclick="newChat()" style="padding:8px 16px;background:var(--btn-neutral,#6c757d);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;margin-left:auto;">New chat</button>
        <button type="button" onclick="goBack('{{.BasePath}}/app')" style="padding:8px 16px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;">Close</button>
    </div>

    <div id="chat"></div>

    <div class="inputbar">
        <span id="fileChip" class="filechip" style="display:none;"></span>
        <input type="text" id="messageInput" placeholder="Ask about your data, e.g. 'How many products are there?' or 'Add this product: ...'" autocomplete="off">
        <button type="button" class="btn-neutral" onclick="document.getElementById('fileInput').click();">📎</button>
        <input type="file" id="fileInput" style="display:none;" onchange="fileChosen(this)">
        <button type="button" class="btn-primary" onclick="send()">Send</button>
    </div>

    <div class="spinner" id="spinner">Thinking<span class="d"></span><span class="d"></span><span class="d"></span><span id="spinTime"></span></div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>Confirm action</h3>
            <div class="summary" id="confirmSummary"></div>
            <pre id="confirmDetail"></pre>
            <div class="actions">
                <button type="button" class="reject" onclick="confirmAction(false)">Reject</button>
                <button type="button" class="approve" onclick="confirmAction(true)">Approve &amp; execute</button>
            </div>
        </div>
    </div>

    <script>
        var fileData = null; // {name, mime, data(base64)}
        var pendingAction = null;
        var chatHistory = []; // conversation turns sent with every request
        var streaming = null; // {div, text} assistant bubble being streamed
        var gotAnyText = false;
        var busy = false;

        var HISTORY_LIMIT = 16; // max turns sent per request (server clamps at 40)

        function addMsg(role, text) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg ' + role;
            if (role === 'assistant') {
                div.innerHTML = md(text);
            } else {
                div.textContent = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        // esc escapes HTML special characters (always applied before any
        // markdown transform, so model output can never inject markup).
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // md renders a safe subset of markdown in already-escaped text:
        // `code`, **bold**, and leading "* "/"- " bullets. Newlines are
        // preserved by the .msg white-space: pre-wrap rule.
        function md(text) {
            var h = esc(text);
            h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
            h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
            h = h.replace(/(^|\n)[ \t]*\* +/g, '$1\u2022 ');
            h = h.replace(/(^|\n)[ \t]*- +/g, '$1\u2022 ');
            return h;
        }

        // addRecordsTable renders a query_records dataset as a table inside a chat
        // bubble. Used as a client-side fallback when a response carries
        // records but no server-rendered fragment (see finishResult).
        function addRecordsTable(records) {
            if (!records || !records.length) return;
            var cols = [];
            var seen = {};
            for (var i = 0; i < records.length; i++) {
                for (var k in records[i]) {
                    if (k === 'collectionId' || k === 'collectionName' || seen[k]) continue;
                    seen[k] = true;
                    cols.push(k);
                }
            }
            cols.sort(function(a, b) {
                if (a === 'id') return -1;
                if (b === 'id') return 1;
                return a < b ? -1 : a > b ? 1 : 0;
            });
            if (!cols.length) return;

            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg tbl';
            var table = document.createElement('table');
            var thead = document.createElement('thead');
            var hr = document.createElement('tr');
            cols.forEach(function(c) {
                var th = document.createElement('th');
                th.textContent = c;
                hr.appendChild(th);
            });
            thead.appendChild(hr);
            table.appendChild(thead);
            var tbody = document.createElement('tbody');
            records.forEach(function(rec) {
                var tr = document.createElement('tr');
                cols.forEach(function(c) {
                    var td = document.createElement('td');
                    var v = rec[c];
                    td.textContent = (v === null || v === undefined) ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            div.appendChild(table);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function goBack(fallback) {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = fallback;
            }
        }

        function fileChosen(input) {
            var f = input.files[0];
            if (!f) return;
            if (f.size > 8 * 1024 * 1024) {
                alert('File too large (max 8 MB).');
                input.value = '';
                return;
            }
            var reader = new FileReader();
            reader.onload = function() {
                var b64 = reader.result.split(',')[1];
                fileData = { name: f.name, mime: f.type || '', data: b64 };
                var chip = document.getElementById('fileChip');
                chip.style.display = 'inline-flex';
                chip.innerHTML = f.name + ' <span class="x" onclick="clearFile()">✕</span>';
            };
            reader.readAsDataURL(f);
        }

        function clearFile() {
            fileData = null;
            document.getElementById('fileChip').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        function send() {
            var input = document.getElementById('messageInput');
            var text = input.value.trim();
            if (!text && !fileData) return;
            if (pendingAction) {
                alert('Please confirm or reject the pending action first.');
                return;
            }
            if (busy) return;
            busy = true;
            if (text) rememberPrompt(text);
            addMsg('user', text || '(file attached)');
            chatHistory.push({ role: 'user', content: text });
            input.value = '';
            gotAnyText = false;
            showSpinner(true);

            var body = { messages: chatHistory.slice(-HISTORY_LIMIT) };
            if (fileData) {
                body.file = fileData;
            }

            fetch('/ai/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
                .then(function(r) {
                    if (!r.ok) {
                        return r.json().then(function(d) {
                            fail(d.message || 'Request failed (' + r.status + ')');
                        });
                    }
                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('text/event-stream') === -1) {
                        // non-SSE fallback (e.g. plain JSON response)
                        return r.json().then(function(d) {
                            showSpinner(false);
                            finishResult(d);
                            busy = false;
                        });
                    }
                    var reader = r.body.getReader();
                    var dec = new TextDecoder();
                    var buf = '';
                    function pump() {
                        return reader.read().then(function(res) {
                            if (res.done) {
                                endStream();
                                showSpinner(false);
                                busy = false;
                                return;
                            }
                            buf += dec.decode(res.value, { stream: true });
                            var idx;
                            while ((idx = buf.indexOf('\n\n')) >= 0) {
                                var raw = buf.slice(0, idx);
                                buf = buf.slice(idx + 2);
                                raw.split('\n').forEach(function(line) {
                                    if (line.slice(0, 5) !== 'data:') return;
                                    try { handleEvent(JSON.parse(line.slice(5))); } catch (e) {}
                                });
                            }
                            return pump();
                        });
                    }
                    return pump();
                })
                .catch(function() {
                    fail('Network error.');
                });
        }

        function fail(message) {
            endStream();
            showSpinner(false);
            addMsg('err', message);
            busy = false;
        }

        function handleEvent(ev) {
            if (ev.type === 'text') {
                showSpinner(false);
                gotAnyText = true;
                if (!streaming) {
                    streaming = { div: addMsg('assistant', ''), text: '' };
                }
                streaming.text += ev.delta;
                streaming.div.innerHTML = md(streaming.text);
                var chat = document.getElementById('chat');
                chat.scrollTop = chat.scrollHeight;
            } else if (ev.type === 'status') {
                endStream();
                addMsg('tool', ev.message);
                showSpinner(true);
            } else if (ev.type === 'done') {
                var st = streaming;
                endStream();
                showSpinner(false);
                busy = false;
                if (ev.result) {
                    finishResult(ev.result, st);
                }
            } else if (ev.type === 'error') {
                fail(ev.message);
            }
        }

        function endStream() {
            if (streaming) streaming = null;
        }

        // applyResultToHistory records the assistant side of a finished turn
        // so follow-up prompts keep their context.
        function applyResultToHistory(result) {
            if (result.transcript && result.transcript.length) {
                for (var i = 0; i < result.transcript.length; i++) {
                    var m = result.transcript[i];
                    if (m.role !== 'user') chatHistory.push({ role: 'assistant', content: m.content });
                }
            } else if (result.records && result.records.length) {
                var cn = result.records[0].collectionName;
                chatHistory.push({ role: 'assistant', content: '(fetched ' + result.records.length + ' records' + (cn ? ' from collection ' + cn : '') + ')' });
            }
        }

        function newChat() {
            chatHistory = [];
            pendingAction = null;
            streaming = null;
            closeConfirm();
            document.getElementById('chat').innerHTML = '';
        }

        function renderResult(data, skipText) {
            var shown = false;
            if (!skipText) {
                if (data.transcript && data.transcript.length) {
                    for (var i = 0; i < data.transcript.length; i++) {
                        var m = data.transcript[i];
                        addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
                        shown = true;
                    }
                }
                if (!shown && data.finalText) {
                    addMsg('assistant', data.finalText);
                }
            } else if (!gotAnyText && data.finalText) {
                addMsg('assistant', data.finalText);
            }
            if (data.pendingAction) {
                pendingAction = data.pendingAction;
                openConfirm(data.pendingAction);
            }
        }

        // finishResult applies the outcome of a finished turn. The preferred
        // source is the server-rendered fragment (records table / detail
        // card / markdown). If that is missing or empty but records were
        // returned (e.g. a stale server build), fall back to the client-side
        // table renderer so a response is never silently dropped.
        function finishResult(result, streamEl) {
            if (result.render) {
                if (streamEl) { streamEl.div.remove(); }
                else if (streaming) { streaming.div.remove(); streaming = null; }
                addRich(result.render);
            } else if (result.records && result.records.length) {
                if (streamEl) { streamEl.div.remove(); }
                else if (streaming) { streaming.div.remove(); streaming = null; }
                if (result.finalText) addMsg('assistant', result.finalText);
                addRecordsTable(result.records);
            } else {
                endStream();
                renderResult(result, true);
            }
            if (result.pendingAction) {
                pendingAction = result.pendingAction;
                openConfirm(result.pendingAction);
            }
            applyResultToHistory(result);
        }

        // addRich injects a server-rendered HTML fragment as a chat bubble.
        // The fragment is sanitized server-side (html/template auto-escaping
        // + bluemonday), so it is safe to assign directly.
        function addRich(html) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg rich';
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function openConfirm(action) {
            document.getElementById('confirmSummary').textContent = action.summary;
            document.getElementById('confirmDetail').textContent = action.detail || '';
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('open');
        }

        function confirmAction(approved) {
            if (!pendingAction) return;
            closeConfirm();
            showSpinner(true);
            fetch('/ai/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actionID: pendingAction.id, approved: approved })
            })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, status: r.status, data: d }; }); })
                .then(function(res) {
                    showSpinner(false);
                    pendingAction = null;
                    if (!res.ok) {
                        addMsg('err', res.data.message || 'Confirm failed (' + res.status + ')');
                        return;
                    }
                    if (res.data.ok) {
                        addMsg('assistant', res.data.message);
                        chatHistory.push({ role: 'assistant', content: 'Executed: ' + res.data.message });
                    } else {
                        addMsg('err', res.data.message);
                        chatHistory.push({ role: 'assistant', content: res.data.message });
                    }
                })
                .catch(function() {
                    showSpinner(false);
                    pendingAction = null;
                    addMsg('err', 'Network error during confirmation.');
                });
        }

        var spinTimer = null;
        function showSpinner(on) {
            var s = document.getElementById('spinner');
            if (on) {
                s.classList.add('show');
                document.getElementById('spinTime').textContent = '';
                var start = Date.now();
                spinTimer = setInterval(function() {
                    var secs = Math.floor((Date.now() - start) / 1000);
                    document.getElementById('spinTime').textContent = secs >= 1 ? secs + 's' : '';
                }, 1000);
            } else {
                s.classList.remove('show');
                if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
            }
        }

        var promptHistory = []; // previously sent prompts (ArrowUp/Down recall)
        var promptIdx = -1;
        var promptDraft = '';

        function rememberPrompt(t) {
            if (promptHistory[promptHistory.length - 1] !== t) {
                promptHistory.push(t);
            }
            promptIdx = promptHistory.length;
            promptDraft = '';
        }

        document.getElementById('messageInput').addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') {
                ev.preventDefault();
                send();
                return;
            }
            if (ev.key === 'Escape') {
                var inp = document.getElementById('messageInput');
                inp.value = '';
                promptIdx = promptHistory.length;
                promptDraft = '';
                inp.blur();
                return;
            }
            if (ev.key === 'ArrowUp') {
                if (promptHistory.length === 0) return;
                if (promptIdx === promptHistory.length) {
                    promptDraft = document.getElementById('messageInput').value;
                    promptIdx = promptHistory.length - 1;
                } else if (promptIdx > 0) {
                    promptIdx--;
                } else {
                    return;
                }
                document.getElementById('messageInput').value = promptHistory[promptIdx];
                ev.preventDefault();
            } else if (ev.key === 'ArrowDown') {
                if (promptIdx >= promptHistory.length) return;
                promptIdx++;
                var inp = document.getElementById('messageInput');
                inp.value = (promptIdx === promptHistory.length) ? promptDraft : promptHistory[promptIdx];
                ev.preventDefault();
            }
        });

        function currentTheme() {
            var t = localStorage.getItem('pbx-theme');
            if (t === 'dark' || t === 'light') return t;
            return document.body.getAttribute('data-theme') || 'light';
        }
        function applyTheme(mode) {
            document.body.setAttribute('data-theme', mode);
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            var next = currentTheme() === 'dark' ? 'light' : 'dark';
            localStorage.setItem('pbx-theme', next);
            applyTheme(next);
            fetch('/api/theme/' + next, { method: 'POST' }).catch(function(){});
        }
        applyTheme(currentTheme());
    </script>
</body>
</html>
