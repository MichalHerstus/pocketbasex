<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t .Lang "agent.title"}} - PBX</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 0; background: var(--body-bg); color:var(--text); height: 100vh; display: flex; flex-direction: column; }
        h1 { margin: 0; font-size: 1.4rem; }
        .topbar { padding: 12px 20px; background:var(--card-bg); border-bottom:1px solid var(--border); display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .topbar .title { font-weight: 600; }
        .topbar .status { font-size: .8rem; color:var(--muted); }
        .topbar .status.bad { color:var(--danger); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: .9rem; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: var(--msg-user-bg); }
        .msg.assistant { align-self: flex-start; background:var(--card-bg); border: 1px solid var(--input-border); min-height: 4.35em; }
        .msg.tool, .msg.err { align-self: center; border-left-width: 4px; display: flex; align-items: center; gap: 8px; max-width: 88%; font-size: .85rem; }        .msg.tool .msg-ico, .msg.err .msg-ico { flex-shrink: 0; line-height: 1; }
        .msg.tool { background:var(--warning-soft); border: 1px solid var(--warning); color: var(--warning-strong); }
        .msg.err { background:var(--danger-soft); border: 1px solid var(--danger); color:var(--danger-strong); }
        .msg.tool .msg-body, .msg.err .msg-body { white-space: pre-wrap; word-wrap: break-word; }
        .msg code { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.tbl { align-self: flex-start; max-width: 95%; padding: 0; overflow: auto; max-height: 320px; }
        .msg.tbl table { width: max-content; min-width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; font-size: .85rem; }
        .msg.tbl th, .msg.tbl td { padding: 8px 12px; text-align: left; border-bottom:1px solid var(--border); white-space: nowrap; }
        .msg.tbl th { position: sticky; top: 0; z-index: 1; background:var(--card2-bg); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color:var(--muted); user-select: none; }
        .msg.tbl tr:hover td { background:var(--row-hover); }
        .msg.rich { align-self: flex-start; max-width: 95%; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--input-border); border-radius: 10px; overflow: auto; }
        .msg.rich .ai-md { font-size: .9rem; line-height: 1.45; color: var(--text); }
        .msg.rich .ai-md p { margin: 0 0 8px 0; }
        .msg.rich .ai-md ul, .msg.rich .ai-md ol { margin: 0 0 8px 0; padding-left: 20px; }
        .msg.rich .ai-md pre { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: .82rem; }
        .msg.rich .ai-md code { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.rich .ai-md pre code { background: none; border: none; padding: 0; }
        .msg.rich .ai-md a { color: var(--accent); }
        .msg.rich .ai-md blockquote { margin: 0 0 8px 0; padding: 0 12px; border-left: 3px solid var(--border2); color: var(--muted); }
        .msg.rich .ai-md h1, .msg.rich .ai-md h2, .msg.rich .ai-md h3 { margin: 10px 0 6px 0; font-size: 1.05rem; }
        .msg.rich .ai-md table { border-collapse: collapse; margin: 0 0 8px 0; font-size: .85rem; }
        .msg.rich .ai-md th, .msg.rich .ai-md td { padding: 5px 10px; border: 1px solid var(--border); }
        .msg.rich .ai-tbl { overflow-x: auto; margin-top: 2px; }
        .msg.rich .ai-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .85rem; }
        .msg.rich .ai-table th, .msg.rich .ai-table td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .msg.rich .ai-table th { background: var(--card2-bg); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
        .msg.rich .ai-table tr:hover td { background: var(--row-hover); }
        .msg.rich .ai-detail { font-size: .9rem; }
        .msg.rich .ai-detail-title { font-weight: 600; font-size: 1rem; margin-bottom: 6px; color: var(--text); }
        .msg.rich .ai-detail dl { margin: 0; display: grid; grid-template-columns: minmax(120px, 1fr) 3fr; gap: 4px 12px; }
        .msg.rich .ai-detail dt { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
        .msg.rich .ai-detail dd { margin: 0; padding: 1px 0; word-break: break-word; }
        .msg.rich .ai-detail dd code { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.rich .rec-link, .msg.rich .ai-detail .rec-link { color: var(--accent); text-decoration: none; font-weight: 600; }
        .msg.rich .rec-link:hover { text-decoration: underline; }
        .msg.rich .ai-detail-actions { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .msg.rich .btn-sm { display: inline-block; padding: 6px 14px; border-radius: 6px; font-size: .85rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; background: var(--btn-primary); color: #fff; }
        .msg.rich .btn-sm.danger { background: var(--btn-danger); color: #fff; }        .inputbar { padding: 12px 20px; background:var(--card-bg); border-top:1px solid var(--border); display: flex; gap: 8px; align-items: center; }
        .inputbar input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 6px; font-size: .9rem; outline: none; }
        .inputbar button { padding: 10px 16px; border: none; border-radius: 6px; font-size: .9rem; cursor: pointer; }
        .btn-primary { background: var(--btn-primary); color: #fff; }
        .btn-neutral { background: var(--btn-neutral); color: #fff; }
        .filechip { display: inline-flex; align-items: center; gap: 6px; background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 4px 8px; font-size: .8rem; }
        .filechip .x { cursor: pointer; color:var(--muted); font-weight: 700; }
        .modal-overlay { position: fixed; inset: 0; background:var(--overlay-bg); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--modal-bg); border-radius: 10px; padding: 20px; max-width: 560px; width: 92%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 8px 0; }
        .modal .summary { font-size: .95rem; font-weight: 600; margin-bottom: 12px; }
        .modal pre { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 10px; font-size: .8rem; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
        .modal .actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
        .modal .actions button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
        .modal .actions .approve { background: var(--btn-primary); color: #fff; }
        .modal .actions .reject { background: var(--btn-danger); color: #fff; }
        .spinner { display: none; font-size: .85rem; color: var(--muted); padding: 8px 20px; align-items: center; }
        .spinner.show { display: flex; }
        .spinner .d { display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite ease-in-out; }
        .spinner .d:nth-of-type(2) { animation-delay: .15s; }
        .spinner .d:nth-of-type(3) { animation-delay: .3s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }
        #spinTime { margin-left: 6px; font-variant-numeric: tabular-nums; }

        /* copy button on code blocks and tables */
        .copy-btn { position: absolute; top: 4px; right: 4px; background: var(--btn-neutral); color: #fff; border: none; border-radius: 4px; padding: 2px 6px; font-size: .75rem; cursor: pointer; opacity: 0; transition: opacity .15s; z-index: 2; line-height: 1.4; }
        pre:hover .copy-btn, table:hover .copy-btn { opacity: .8; }
        .copy-btn:hover { opacity: 1 !important; }
        .copy-btn.copied { background: var(--success, #2e7d32); }

        /* markdown in assistant bubbles */
        .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 10px 0 4px 0; font-size: 1.05rem; }
        .msg.assistant h1:first-child, .msg.assistant h2:first-child, .msg.assistant h3:first-child { margin-top: 0; }
        .msg.assistant p { margin: 0 0 6px 0; }
        .msg.assistant pre { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: .82rem; }
        .msg.assistant code { background:var(--readonly-bg); border: 1px solid var(--input-border); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
        .msg.assistant pre code { background: none; border: none; padding: 0; }
        .msg.assistant blockquote { margin: 0 0 6px 0; padding: 0 12px; border-left: 3px solid var(--border2); color: var(--muted); }
        .msg.assistant a { color: var(--accent); }
        .msg.assistant ul, .msg.assistant ol { margin: 0 0 6px 0; padding-left: 20px; }
        .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

        /* navigation suggestion chip */
        .msg.nav-chat { align-self: flex-start; padding: 6px 14px; }
        .nav-btn { padding: 8px 16px; background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; font-size: .88rem; font-weight: 600; cursor: pointer; }
        .nav-btn:hover { background: var(--accent); color: #fff; }

        /* regenerate button */
        .msg.assistant, .msg.rich { position: relative; }        .regen-btn { position: absolute; top: 6px; right: 6px; background: var(--btn-neutral); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: .85rem; cursor: pointer; opacity: 0; transition: opacity .15s; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .msg.assistant:hover .regen-btn, .msg.rich:hover .regen-btn { opacity: .85; }
        .regen-btn:hover { opacity: 1 !important; }
        .regen-btn.spin { animation: regen-spin .8s linear; }
        @keyframes regen-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* conversation history sidebar */
        .conv-sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--card-bg); border-right: 1px solid var(--border); box-shadow: 2px 0 12px rgba(0,0,0,.12); transform: translateX(-100%); transition: transform .18s ease; z-index: 90; display: flex; flex-direction: column; }
        .conv-sidebar.open { transform: translateX(0); }
        .conv-sidebar-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .conv-sidebar-title { font-weight: 600; font-size: .95rem; }
        .conv-close { background: none; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 4px; }
        .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
        .conv-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
        .conv-item:hover { background: var(--row-hover); }
        .conv-item.active { background: var(--row-hover); }
        .conv-item .cn-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
        .conv-item .cn-time { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
        .conv-item .cn-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .85rem; padding: 2px 4px; flex-shrink: 0; border-radius: 4px; }
        .conv-item .cn-del:hover { color: var(--danger); background: var(--danger-soft); }
        .conv-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: .85rem; }
        .welcome-screen { padding: 32px 16px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
        .welcome-title { font-size: 1.2rem; font-weight: 600; color: var(--text); }
        .welcome-hint { font-size: .9rem; color: var(--muted); }
        .welcome-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .welcome-chip { padding: 10px 16px; border-radius: 20px; background: var(--btn-neutral); color: #fff; font-size: .9rem; cursor: pointer; border: none; transition: transform .1s; }
        .welcome-chip:hover { transform: scale(1.03); }
        .slash-menu { position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px; min-width: 240px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 12px var(--shadow); z-index: 1000; max-height: 280px; overflow-y: auto; display: none; }
        .slash-menu.open { display: block; }
        .slash-item { padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--border); }
        .slash-item:last-child { border-bottom: none; }
        .slash-item:hover, .slash-item.highlighted { background: var(--row-hover); }
        .slash-cmd { font-weight: 600; font-family: monospace; font-size: .85rem; }
        .slash-desc { font-size: .75rem; color: var(--muted); }
        .inputbar { position: relative; }
        .conv-sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
        .conv-clear { width: 100%; padding: 9px; border: none; border-radius: 6px; background: var(--btn-neutral); color: #fff; cursor: pointer; font-size: .9rem; }
        .conv-overlay { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 85; display: none; }
        .conv-overlay.open { display: block; }
    </style>
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/api/lang/{{.Lang}}/catalog.js"></script>
    <script src="/assets/marked.min.js"></script>
</head>
<body data-theme="{{.Theme}}">
    <div class="topbar">
        <button type="button" id="convToggle" onclick="toggleSidebar()" class="pbx-icon-btn" title="{{t .Lang "agent.history"}}">☰</button>
        <button type="button" id="themeBtn" onclick="toggleTheme()" class="pbx-icon-btn">🌙</button>
        <button type="button" onclick="toggleLang()" class="pbx-icon-btn">{{if eq .Lang "cs"}}EN{{else}}CS{{end}}</button>
        <span class="title">{{t .Lang "agent.title"}}</span>
        <span id="status" class="status {{if not .Config.Enabled}}bad{{end}}">{{.Status}}</span>
        <button type="button" onclick="newChat()" style="padding:8px 16px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;margin-left:auto;">{{t .Lang "agent.newChat"}}</button>
        <button type="button" onclick="goBack('{{.BasePath}}/app')" style="padding:8px 16px;background:var(--btn-neutral);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;">{{t .Lang "common.close"}}</button>
    </div>

    <aside id="convSidebar" class="conv-sidebar">
        <div class="conv-sidebar-head">
            <span class="conv-sidebar-title">{{t .Lang "agent.history"}}</span>
            <button type="button" class="conv-close" onclick="toggleSidebar()">✕</button>
        </div>
        <div id="convList" class="conv-list"></div>
        <div class="conv-sidebar-foot">
            <button type="button" class="conv-clear" onclick="newChat()">{{t .Lang "agent.newChat"}}</button>
        </div>
    </aside>
    <div id="convOverlay" class="conv-overlay" onclick="toggleSidebar()"></div>

    <div id="chat">
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-title" id="welcomeTitle">{{t .Lang "agent.welcomeTitle"}}</div>
            <div class="welcome-hint" id="welcomeHint">{{t .Lang "agent.welcomeHint"}}</div>
            <div class="welcome-chips" id="welcomeChips"></div>
        </div>
    </div>

    <div class="inputbar">
        <span id="fileChip" class="filechip" style="display:none;"></span>
        <input type="text" id="messageInput" placeholder="{{t .Lang "agent.placeholder"}}" autocomplete="off">
        <button type="button" class="btn-neutral" onclick="document.getElementById('fileInput').click();">📎</button>
        <input type="file" id="fileInput" style="display:none;" onchange="fileChosen(this)">
        <button type="button" class="btn-primary" onclick="send()">{{t .Lang "agent.send"}}</button>
        <div id="slashMenu" class="slash-menu"></div>
    </div>

    <div class="spinner" id="spinner">{{t .Lang "agent.thinking"}}<span class="d"></span><span class="d"></span><span class="d"></span><span id="spinTime"></span></div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>{{t .Lang "agent.confirmTitle"}}</h3>
            <div class="summary" id="confirmSummary"></div>
            <pre id="confirmDetail"></pre>
            <div class="actions">
                <button type="button" class="reject" onclick="confirmAction(false)">{{t .Lang "agent.reject"}}</button>
                <button type="button" class="approve" onclick="confirmAction(true)">{{t .Lang "agent.approveExecute"}}</button>
            </div>
        </div>
    </div>

    <script>
        var fileData = null; // {name, mime, data(base64)}
        var pendingAction = null;
        var chatHistory = []; // conversation turns sent with every request
        var streaming = null; // {div, text} assistant bubble being streamed
        var gotAnyText = false;
        var busy = false;
        var chatAbort = null; // AbortController for the in-flight /ai/chat/stream request
        var escArm = false;   // double-ESC cancel arming
        var escArmAt = 0;
        var convId = null;    // id of the persisted conversation being continued (null = new)

        var HISTORY_LIMIT = 16; // max turns sent per request (server clamps at 40)

        // --- Phase 5: suggestions + slash commands ---
        var slashCommands = [
            { cmd: '/help', descKey: 'agent.cmdHelp' },
            { cmd: '/list', descKey: 'agent.cmdList' },
            { cmd: '/create', descKey: 'agent.cmdCreate' },
            { cmd: '/search', descKey: 'agent.cmdSearch' },
            { cmd: '/schema', descKey: 'agent.cmdSchema' },
            { cmd: '/stats', descKey: 'agent.cmdStats' },
        ];
        var slashMenuVisible = false;
        var slashHighlighted = -1; // DOM item index currently highlighted
        var slashFiltered = [];    // command indexes rendered in the menu

        async function loadSuggestions() {
            try {
                var resp = await fetch('/api/ai/suggestions');
                if (!resp.ok) return;
                var data = await resp.json();
                if (!data.collections || !data.collections.length) return;
                renderWelcomeChips(data.collections);
            } catch (e) {}
        }

        function renderWelcomeChips(collections) {
            var container = document.getElementById('welcomeChips');
            if (!container) return;
            container.innerHTML = '';
            var browse = _t('agent.suggestBrowse');
            collections.forEach(function(c) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'welcome-chip';
                btn.textContent = browse + ' ' + esc(c.name) + ' (' + c.count + ')';
                btn.onclick = function() {
                    var input = document.getElementById('messageInput');
                    input.value = _t('agent.suggestBrowse') + ' "' + c.name + '"';
                    input.focus();
                    hideWelcome();
                };
                container.appendChild(btn);
            });
            // set title/hint
            document.getElementById('welcomeTitle').textContent = _t('agent.welcomeTitle');
            document.getElementById('welcomeHint').textContent = _t('agent.welcomeHint');
        }

        function hideWelcome() {
            var ws = document.getElementById('welcomeScreen');
            if (ws) ws.style.display = 'none';
        }

        function showSlashMenu() {
            var input = document.getElementById('messageInput');
            var menu = document.getElementById('slashMenu');
            if (!input || !menu) return;
            var val = input.value.trim();
            if (!val.startsWith('/')) { hideSlashMenu(); return; }
            // once a command is selected and the user is typing its argument
            // (e.g. "/list produkty"), the menu stays closed
            if (val.indexOf(' ') > 0) { hideSlashMenu(); return; }
            var prefix = val.slice(1).toLowerCase();
            var html = '';
            slashFiltered = [];
            slashCommands.forEach(function(c, i) {
                if (c.cmd.slice(1).startsWith(prefix)) {
                    slashFiltered.push(i);
                    html += '<div class="slash-item" data-idx="' + i + '"><span class="slash-cmd">' + esc(c.cmd) + '</span><span class="slash-desc">' + _t(c.descKey) + '</span></div>';
                }
            });
            if (!html) {
                hideSlashMenu();
                return;
            }
            menu.innerHTML = html;
            menu.classList.add('open');
            slashMenuVisible = true;
            slashHighlighted = 0;
            highlightSlashItem();
            menu.querySelectorAll('.slash-item').forEach(function(el) {
                el.onclick = function() {
                    var i = parseInt(el.dataset.idx, 10);
                    selectSlashCommand(i);
                };
            });
        }

        function hideSlashMenu() {
            var menu = document.getElementById('slashMenu');
            if (menu) menu.classList.remove('open');
            slashMenuVisible = false;
            slashHighlighted = -1;
            slashFiltered = [];
        }

        function highlightSlashItem() {
            var items = document.querySelectorAll('#slashMenu .slash-item');
            items.forEach(function(el, i) {
                el.classList.toggle('highlighted', i === slashHighlighted);
                if (i === slashHighlighted) el.scrollIntoView({ block: 'nearest' });
            });
        }

        function moveSlashHighlight(delta) {
            var items = document.querySelectorAll('#slashMenu .slash-item');
            if (!items.length) return;
            slashHighlighted = Math.min(Math.max(slashHighlighted + delta, 0), items.length - 1);
            highlightSlashItem();
        }

        function selectSlashCommand(i) {
            var c = slashCommands[i];
            if (!c) return;
            var input = document.getElementById('messageInput');
            input.value = c.cmd + ' ';
            input.focus();
            hideSlashMenu();
        }

        function expandSlashCommand(text) {
            var m = text.match(/^\/(help|list|create|search|schema|stats)\b\s*(.*)$/i);
            if (!m) return text;
            var verb = m[1].toLowerCase();
            var rest = m[2].trim();
            switch (verb) {
                case 'help':
                    return _t('agent.cmdHelp') + '?';
                case 'list':
                    return rest ? 'List all records in "' + rest + '"' : text;
                case 'create':
                    return rest ? 'Create a record: ' + rest : text;
                case 'search':
                    return rest ? 'Find records matching: ' + rest : text;
                case 'schema':
                    return rest ? 'Show the schema (fields) of the collection "' + rest + '"' : text;
                case 'stats':
                    return rest ? 'Show statistics for "' + rest + '"' : text;
            }
            return text;
        }

        function addMsg(role, text) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg ' + role;
            if (role === 'assistant') {
                div.innerHTML = md(text);
            } else if (role === 'tool' || role === 'err') {
                div.innerHTML = '<span class="msg-ico">' + (role === 'err' ? '&#10007;' : '&#9888;') + '</span><span class="msg-body">' + esc(text) + '</span>';
            } else {
                div.textContent = text;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            if (role === 'assistant') updateRegenButtons();
            return div;
        }

        // esc escapes HTML special characters (always applied before any
        // markdown transform, so model output can never inject markup).
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function pbxToast(kind, msg, persist) {
            var host = document.querySelector(".toast-host");
            if (!host) { host = document.createElement("div"); host.className = "toast-host"; document.body.appendChild(host); }
            var t = document.createElement("div");
            t.className = "alert alert-" + kind + " alert-toast mount";
            t.setAttribute("role", "alert");
            var ico = { success: "&#10004;", danger: "&#10007;", warning: "&#9888;", info: "&#8505;" }[kind] || "&#8505;";
            t.innerHTML = '<span class="a-ico">' + ico + '</span><span class="a-body">' + esc(msg) + '</span>';
            var dismiss = function() { t.classList.add("leaving"); setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 200); };
            t.addEventListener("click", dismiss);
            host.appendChild(t);
            var listed = host.querySelectorAll(".alert");
            while (listed.length > 3) { listed[0].parentNode.removeChild(listed[0]); }
            if (!persist) setTimeout(dismiss, 4500);
            return t;
        }

        // Configure marked for streaming-safe markdown rendering.
        // Breaks: true makes newlines render as <br> (matches pre-wrap behaviour).
        // Escaping the input first prevents LLM output from injecting raw HTML.
        if (typeof marked !== 'undefined') {
            marked.setOptions({ breaks: true, gfm: true, headerIds: false, mangle: false });
        }

        function md(text) {
            if (!text) return '';
            var safe = esc(text);
            if (typeof marked !== 'undefined') {
                return marked.parse(safe);
            }
            // fallback if marked failed to load
            return safe.replace(/`([^`\n]+)`/g, '<code>$1</code>')
                       .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        }

        // addRecordsTable renders a query_records dataset as a table inside a chat
        // bubble. Used as a client-side fallback when a response carries
        // records but no server-rendered fragment (see finishResult).
        function addRecordsTable(records) {
            if (!records || !records.length) return;
            var cols = [];
            var seen = {};
            for (var i = 0; i < records.length; i++) {
                for (var k in records[i]) {
                    if (k === 'collectionId' || k === 'collectionName' || seen[k]) continue;
                    seen[k] = true;
                    cols.push(k);
                }
            }
            cols.sort(function(a, b) {
                if (a === 'id') return -1;
                if (b === 'id') return 1;
                return a < b ? -1 : a > b ? 1 : 0;
            });
            if (!cols.length) return;

            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg tbl';
            var table = document.createElement('table');
            var thead = document.createElement('thead');
            var hr = document.createElement('tr');
            cols.forEach(function(c) {
                var th = document.createElement('th');
                th.textContent = c;
                hr.appendChild(th);
            });
            thead.appendChild(hr);
            table.appendChild(thead);
            var tbody = document.createElement('tbody');
            records.forEach(function(rec) {
                var tr = document.createElement('tr');
                cols.forEach(function(c) {
                    var td = document.createElement('td');
                    var v = rec[c];
                    td.textContent = (v === null || v === undefined) ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            div.appendChild(table);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            initCopyButtons(div);
        }

        function goBack(fallback) {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = fallback;
            }
        }

        function fileChosen(input) {
            var f = input.files[0];
            if (!f) return;
            if (f.size > 8 * 1024 * 1024) {
                pbxToast('warning', 'File too large (max 8 MB).');
                input.value = '';
                return;
            }
            var reader = new FileReader();
            reader.onload = function() {
                var b64 = reader.result.split(',')[1];
                fileData = { name: f.name, mime: f.type || '', data: b64 };
                var chip = document.getElementById('fileChip');
                chip.style.display = 'inline-flex';
                chip.innerHTML = f.name + ' <span class="x" onclick="clearFile()">✕</span>';
            };
            reader.readAsDataURL(f);
        }

        function clearFile() {
            fileData = null;
            document.getElementById('fileChip').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        function send() {
            var input = document.getElementById('messageInput');
            var text = input.value.trim();
            text = expandSlashCommand(text);
            if (!text && !fileData) return;
            if (pendingAction) {
                pbxToast('warning', 'Please confirm or reject the pending action first.');
                return;
            }
            if (busy) return;
            busy = true;
            escArm = false;
            chatAbort = null;
            var ac = new AbortController();
            chatAbort = ac;
            if (text) rememberPrompt(text);
            hideWelcome();
            addMsg('user', text || '(file attached)');
            chatHistory.push({ role: 'user', content: text });
            input.value = '';
            gotAnyText = false;
            showSpinner(true);

            var body = { messages: chatHistory.slice(-HISTORY_LIMIT) };
            if (fileData) {
                body.file = fileData;
            }

            fetch('/ai/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                signal: ac.signal
            })
                .then(function(r) {
                    if (!r.ok) {
                        return r.json().then(function(d) {
                            fail(d.message || 'Request failed (' + r.status + ')');
                        });
                    }
                    var ct = r.headers.get('content-type') || '';
                    if (ct.indexOf('text/event-stream') === -1) {
                        // non-SSE fallback (e.g. plain JSON response)
                        return r.json().then(function(d) {
                            showSpinner(false);
                            finishResult(d);
                            busy = false;
                            chatAbort = null;
                        });
                    }
                    var reader = r.body.getReader();
                    var dec = new TextDecoder();
                    var buf = '';
                    function pump() {
                        return reader.read().then(function(res) {
                            if (res.done) {
                                endStream();
                                showSpinner(false);
                                busy = false;
                                chatAbort = null;
                                return;
                            }
                            buf += dec.decode(res.value, { stream: true });
                            var idx;
                            while ((idx = buf.indexOf('\n\n')) >= 0) {
                                var raw = buf.slice(0, idx);
                                buf = buf.slice(idx + 2);
                                raw.split('\n').forEach(function(line) {
                                    if (line.slice(0, 5) !== 'data:') return;
                                    try { handleEvent(JSON.parse(line.slice(5))); } catch (e) {}
                                });
                            }
                            return pump();
                        });
                    }
                    return pump();
                })
                .catch(function() {
                    if (ac.signal.aborted) {
                        stopStream();
                        return;
                    }
                    fail('Network error.');
                });
        }

        function fail(message) {
            endStream();
            showSpinner(false);
            addMsg('err', message);
            busy = false;
            chatAbort = null;
            escArm = false;
            updateRegenButtons();
        }

        // stopStream is the user-initiated cancel path (double-ESC). It keeps
        // any partial assistant text on screen and only marks the turn ended.
        function stopStream() {
            endStream();
            showSpinner(false);
            if (!gotAnyText) {
                streaming = null;
            }
            addMsg('tool', _t('ai.stopped'));
            busy = false;
            chatAbort = null;
            escArm = false;
            updateRegenButtons();
        }

        function handleEvent(ev) {
            if (ev.type === 'text') {
                showSpinner(false);
                gotAnyText = true;
                if (!streaming) {
                    streaming = { div: addMsg('assistant', ''), text: '' };
                }
                streaming.text += ev.delta;
                streaming.div.innerHTML = md(streaming.text);
                var chat = document.getElementById('chat');
                chat.scrollTop = chat.scrollHeight;
            } else if (ev.type === 'status') {
                endStream();
                addMsg('tool', ev.message);
                showSpinner(true);
            } else if (ev.type === 'done') {
                var st = streaming;
                endStream();
                showSpinner(false);
                busy = false;
                chatAbort = null;
                escArm = false;
                if (ev.result) {
                    finishResult(ev.result, st);
                }
            } else if (ev.type === 'error') {
                fail(ev.message);
            }
        }

        function endStream() {
            if (streaming) streaming = null;
        }

        // applyResultToHistory records the assistant side of a finished turn
        // so follow-up prompts keep their context.
        function applyResultToHistory(result) {
            if (result.transcript && result.transcript.length) {
                for (var i = 0; i < result.transcript.length; i++) {
                    var m = result.transcript[i];
                    if (m.role !== 'user') chatHistory.push({ role: 'assistant', content: m.content });
                }
            } else if (result.records && result.records.length) {
                var cn = result.records[0].collectionName;
                chatHistory.push({ role: 'assistant', content: '(fetched ' + result.records.length + ' records' + (cn ? ' from collection ' + cn : '') + ')' });
            }
        }

        function newChat() {
            chatHistory = [];
            pendingAction = null;
            streaming = null;
            convId = null;
            closeConfirm();
            document.getElementById('chat').innerHTML = '';
            showWelcome();
            loadConversations();
            loadSuggestions();
        }

        function showWelcome() {
            var chat = document.getElementById('chat');
            if (!chat || document.getElementById('welcomeScreen')) return;
            var div = document.createElement('div');
            div.id = 'welcomeScreen';
            div.className = 'welcome-screen';
            div.innerHTML = '<div class="welcome-title" id="welcomeTitle"></div>' +
                            '<div class="welcome-hint" id="welcomeHint"></div>' +
                            '<div class="welcome-chips" id="welcomeChips"></div>';
            chat.appendChild(div);
        }

        function renderResult(data, skipText) {
            var shown = false;
            if (!skipText) {
                if (data.transcript && data.transcript.length) {
                    for (var i = 0; i < data.transcript.length; i++) {
                        var m = data.transcript[i];
                        addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
                        shown = true;
                    }
                }
                if (!shown && data.finalText) {
                    addMsg('assistant', data.finalText);
                }
            } else if (!gotAnyText && data.finalText) {
                addMsg('assistant', data.finalText);
            }
            if (data.pendingAction) {
                pendingAction = data.pendingAction;
                openConfirm(data.pendingAction);
            }
        }

        // finishResult applies the outcome of a finished turn. The preferred
        // source is the server-rendered fragment (records table / detail
        // card / markdown). If that is missing or empty but records were
        // returned (e.g. a stale server build), fall back to the client-side
        // table renderer so a response is never silently dropped.
        function finishResult(result, streamEl) {
            hideWelcome();
            if (result.render) {
                if (streamEl) { streamEl.div.remove(); }
                else if (streaming) { streaming.div.remove(); streaming = null; }
                addRich(result.render);
            } else if (result.records && result.records.length) {
                if (streamEl) { streamEl.div.remove(); }
                else if (streaming) { streaming.div.remove(); streaming = null; }
                if (result.finalText) addMsg('assistant', result.finalText);
                addRecordsTable(result.records);
            } else {
                endStream();
                renderResult(result, true);
            }
            if (result.pendingAction) {
                pendingAction = result.pendingAction;
                openConfirm(result.pendingAction);
            }
            if (result.navigate) {
                addNavigateChip(result.navigate);
            }
            if (result.export) {
                addExportChip(result.export);
            }
            applyResultToHistory(result);
            saveConversation();
        }

        // addNavigateChip renders a clickable "Go to" button for a navigate_to
        // suggestion. The user confirms the jump rather than navigating on
        // its own.
        function addNavigateChip(nav) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg nav-chat';
            var label = 'Go to ' + nav.configName + (nav.recordId ? ' / ' + nav.recordId : '');
            var href = '/' + (nav.target === 'form' ? 'form' : 'tabular') + '/' + encodeURIComponent(nav.configName);
            if (nav.target === 'form' && nav.recordId) href += '/' + encodeURIComponent(nav.recordId);
            div.innerHTML = '<button type="button" class="nav-btn" data-href="' + esc(href) + '">\u2192 ' + esc(label) + '</button>';
            var btn = div.querySelector('.nav-btn');
            btn.onclick = function() {
                var h = btn.getAttribute('data-href');
                if (window.history && window.location.pathname !== h) {
                    window.location.href = h;
                }
            };
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            updateRegenButtons();
        }

        // addExportChip renders a download button for an export_data result.
        // The click triggers a hidden <a> download so the browser keeps the
        // current page intact while the file is saved.
        function addExportChip(exp) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg nav-chat';
            div.innerHTML = '<button type="button" class="nav-btn export-btn">\u2193 Download export (' + esc(exp.filename) + ')</button>';
            var btn = div.querySelector('.export-btn');
            btn.onclick = function() {
                var a = document.createElement('a');
                a.href = '/api/ai/exports/' + encodeURIComponent(exp.id);
                a.download = exp.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            updateRegenButtons();
        }

        // addRich injects a server-rendered HTML fragment as a chat bubble.
        // The fragment is sanitized server-side (html/template auto-escaping
        // + bluemonday), so it is safe to assign directly.
        function addRich(html) {
            var chat = document.getElementById('chat');
            var div = document.createElement('div');
            div.className = 'msg rich';
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            initCopyButtons(div);
            updateRegenButtons();
        }

        // copyToClipboard copies a string, falling back to a selection-based
        // method for older browsers / non-secure contexts.
        function copyToClipboard(text, btn, label) {
            function done() {
                var old = btn.textContent;
                btn.textContent = label || 'Copied!';
                btn.classList.add('copied');
                setTimeout(function() { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
            }
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(function() { fallback(); });
            } else {
                fallback();
            }
            function fallback() {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
                done();
            }
        }

        // initCopyButtons attaches a copy button to a bubble's code blocks and
        // tables (both .msg.tbl and .msg.rich .ai-table).
        function initCopyButtons(root) {
            if (!root) root = document.getElementById('chat');
            var targets = root.querySelectorAll('pre, .ai-table, table.ai-table, .msg.tbl table');
            for (var i = 0; i < targets.length; i++) {
                var el = targets[i];
                if (el.getAttribute('data-copy-ready')) continue;
                el.setAttribute('data-copy-ready', '1');
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'copy-btn';
                btn.textContent = '\u2398'; // ⎘
                btn.title = 'Copy';
                btn.onclick = function() {
                    var text = el.textContent;
                    copyToClipboard(text, btn);
                };
                el.style.position = 'relative';
                el.appendChild(btn);
            }
        }

        // updateRegenButtons ensures only the last assistant/rich message shows
        // the regenerate (↻) button. Previous assistant messages lose theirs.
        function updateRegenButtons() {
            var chat = document.getElementById('chat');
            var targets = chat.querySelectorAll('.msg.assistant, .msg.rich');
            // remove all existing regen buttons
            var old = chat.querySelectorAll('.regen-btn');
            for (var i = 0; i < old.length; i++) old[i].remove();
            if (targets.length === 0) return;
            var last = targets[targets.length - 1];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'regen-btn';
            btn.textContent = '\u21BB';
            btn.title = _t('ai.regenerate') || 'Regenerate';
            btn.onclick = function() { regenerate(); };
            last.appendChild(btn);
        }

        // regenerate removes the last assistant turn and re-sends the
        // conversation so the LLM produces a fresh response.
        function regenerate() {
            if (busy || chatHistory.length < 2) return;
            var chat = document.getElementById('chat');
            // find and remove the last assistant bubble (.msg.assistant or .msg.rich)
            var targets = chat.querySelectorAll('.msg.assistant, .msg.rich');
            if (targets.length) {
                var last = targets[targets.length - 1];
                last.remove();
            }
            // remove the last assistant entry from chatHistory
            for (var i = chatHistory.length - 1; i >= 0; i--) {
                if (chatHistory[i].role === 'assistant') {
                    chatHistory.splice(i, 1);
                    break;
                }
            }
            updateRegenButtons();
            // re-send the user's last prompt
            for (var j = chatHistory.length - 1; j >= 0; j--) {
                if (chatHistory[j].role === 'user') {
                    var userMsg = chatHistory[j].content;
                    chatHistory.splice(j, 1);
                    document.getElementById('messageInput').value = userMsg;
                    send();
                    return;
                }
            }
        }

        function openConfirm(action) {
            document.getElementById('confirmSummary').textContent = action.summary;
            document.getElementById('confirmDetail').textContent = action.detail || '';
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('open');
        }

        // delegate clicks on the delete buttons rendered inside detail cards
        document.addEventListener('click', function(ev) {
            var btn = ev.target.closest ? ev.target.closest('.del-rec-btn') : null;
            if (!btn) return;
            ev.preventDefault();
            var coll = btn.getAttribute('data-coll');
            var id = btn.getAttribute('data-id');
            if (!coll || !id) return;
            showSpinner(true);
            fetch('/ai/delete-record', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ collection: coll, recordId: id })
            })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(res) {
                    showSpinner(false);
                    if (!res.ok) {
                        addMsg('err', res.data.message || 'Failed to start delete.');
                        return;
                    }
                    pendingAction = res.data.pendingAction;
                    if (pendingAction) openConfirm(pendingAction);
                })
                .catch(function() {
                    showSpinner(false);
                    addMsg('err', 'Network error.');
                });
        });

        function confirmAction(approved) {
            if (!pendingAction) return;
            closeConfirm();
            showSpinner(true);
            fetch('/ai/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actionID: pendingAction.id, approved: approved })
            })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, status: r.status, data: d }; }); })
                .then(function(res) {
                    showSpinner(false);
                    pendingAction = null;
                    if (!res.ok) {
                        addMsg('err', res.data.message || 'Confirm failed (' + res.status + ')');
                        return;
                    }
                    if (res.data.ok) {
                        addMsg('assistant', res.data.message);
                        chatHistory.push({ role: 'assistant', content: 'Executed: ' + res.data.message });
                    } else {
                        addMsg('err', res.data.message);
                        chatHistory.push({ role: 'assistant', content: res.data.message });
                    }
                    saveConversation();
                })
                .catch(function() {
                    showSpinner(false);
                    pendingAction = null;
                    addMsg('err', 'Network error during confirmation.');
                });
        }

        // ---- Conversation persistence (Phase 3) ----

        function toggleSidebar() {
            var sb = document.getElementById('convSidebar');
            var ov = document.getElementById('convOverlay');
            var open = !sb.classList.contains('open');
            sb.classList.toggle('open', open);
            ov.classList.toggle('open', open);
            if (open) loadConversations();
        }

        // loadConversations fetches the persisted list and renders it.
        function loadConversations() {
            fetch('/ai/conversations')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    renderConvList(d.conversations || []);
                })
                .catch(function() {});
        }

        function renderConvList(items) {
            var list = document.getElementById('convList');
            list.innerHTML = '';
            if (!items.length) {
                list.innerHTML = '<div class="conv-empty">' + esc(_t('agent.noHistory')) + '</div>';
                return;
            }
            items.forEach(function(c) {
                var item = document.createElement('div');
                item.className = 'conv-item' + (c.id === convId ? ' active' : '');
                var del = document.createElement('button');
                del.type = 'button';
                del.className = 'cn-del';
                del.textContent = '🗑';
                del.title = _t('agent.deleteConv') || 'Delete';
                del.onclick = function(ev) {
                    ev.stopPropagation();
                    deleteConversation(c.id);
                };
                var t = document.createElement('span');
                t.className = 'cn-title';
                t.textContent = c.title || '(no title)';
                var tm = document.createElement('span');
                tm.className = 'cn-time';
                tm.textContent = fmtWhen(c.updated);
                item.appendChild(t);
                item.appendChild(tm);
                item.appendChild(del);
                item.onclick = function() { openConversation(c.id); };
                list.appendChild(item);
            });
        }

        // fmtWhen formats an ISO timestamp as a short relative label.
        function fmtWhen(iso) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            var diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return _t('ai.justNow') || 'now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h';
            return d.toLocaleDateString();
        }

        // openConversation loads a persisted conversation and replays it.
        function openConversation(id) {
            if (busy) return;
            fetch('/ai/conversations/' + encodeURIComponent(id))
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (!d.messages) return;
                    closeConfirm();
                    document.getElementById('chat').innerHTML = '';
                    chatHistory = [];
                    pendingAction = null;
                    convId = d.id;
                    (d.messages || []).forEach(function(m) {
                        chatHistory.push({ role: m.role, content: m.content });
                        if (m.role === 'user') {
                            addMsg('user', m.content);
                        } else {
                            addMsg('assistant', m.content);
                        }
                    });
                    updateRegenButtons();
                    toggleSidebar();
                })
                .catch(function() {});
        }

        // deleteConversation removes the conversation then refreshes the list.
        function deleteConversation(id) {
            fetch('/ai/conversations/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
                .then(function(r) {
                    if (id === convId) { convId = null; }
                    loadConversations();
                })
                .catch(function() {});
        }

        // saveConversation persists the full transcript. Called fire-and-forget
        // after every finished turn so even a closed tab keeps the last turn.
        // It derives/picks the conversation id only on the first save of a new
        // thread; subsequent saves keep the same id for the same thread.
        function saveConversation() {
            if (!chatHistory.length) return;
            var body = { messages: chatHistory };
            if (convId) body.conversationId = convId;
            fetch('/ai/conversations/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.id) convId = d.id;
                })
                .catch(function() {});
        }

        var spinTimer = null;
        function showSpinner(on) {
            var s = document.getElementById('spinner');
            if (on) {
                s.classList.add('show');
                document.getElementById('spinTime').textContent = '';
                var start = Date.now();
                spinTimer = setInterval(function() {
                    var secs = Math.floor((Date.now() - start) / 1000);
                    document.getElementById('spinTime').textContent = secs >= 1 ? secs + 's' : '';
                }, 1000);
            } else {
                s.classList.remove('show');
                if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
            }
        }

        var promptHistory = []; // previously sent prompts (ArrowUp/Down recall)
        var promptIdx = -1;
        var promptDraft = '';

        function rememberPrompt(t) {
            if (promptHistory[promptHistory.length - 1] !== t) {
                promptHistory.push(t);
            }
            promptIdx = promptHistory.length;
            promptDraft = '';
        }

        // ESC-ESC cancel works from anywhere on the page while a stream is
        // running (focus-independent), like OpenCode. Bound on document because
        // clicking the Send button moves focus off the message input.
        document.addEventListener('keydown', function(ev) {
            if (ev.key !== 'Escape' || !busy) return;
            ev.preventDefault();
            var now = Date.now();
            if (!escArm || now - escArmAt > 1500) {
                escArm = true;
                escArmAt = now;
                pbxToast('info', _t('ai.stopHint'));
                return;
            }
            escArm = false;
            if (chatAbort) chatAbort.abort();
        });

        document.getElementById('messageInput').addEventListener('keydown', function(ev) {
            // Slash menu navigation (arrow up/down, Enter to select, Esc to close)
            if (slashMenuVisible) {
                if (ev.key === 'ArrowDown') { ev.preventDefault(); moveSlashHighlight(1); return; }
                if (ev.key === 'ArrowUp')   { ev.preventDefault(); moveSlashHighlight(-1); return; }
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    var its = document.querySelectorAll('#slashMenu .slash-item');
                    if (slashHighlighted >= 0 && its[slashHighlighted]) {
                        selectSlashCommand(parseInt(its[slashHighlighted].dataset.idx, 10));
                    }
                    return;
                }
                if (ev.key === 'Escape') {
                    ev.preventDefault();
                    hideSlashMenu();
                    return;
                }
            }

            // Open the palette the instant "/" is typed (keydown). At keydown time the
            // character isn't inserted into the input yet, so defer the open by
            // one tick; the input event then re-syncs the filter anyway. If
            // that path is ever broken, this keeps the menu appearing.
            if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !slashMenuVisible && !ev.target.value) {
                setTimeout(showSlashMenu, 0);
                return;
            }

            // A bare "/" or a lone slash command must never be sent to the AI:
            // pressing Enter with a command word still open selects it instead.
            if (ev.key === 'Enter') {
                var val = document.getElementById('messageInput').value.trim();
                if (/^\/[a-z]*$/i.test(val)) {
                    ev.preventDefault();
                    showSlashMenu();
                    if (slashMenuVisible && slashHighlighted >= 0) {
                        var its = document.querySelectorAll('#slashMenu .slash-item');
                        if (its[slashHighlighted]) selectSlashCommand(parseInt(its[slashHighlighted].dataset.idx, 10));
                    }
                    return;
                }
                ev.preventDefault();
                send();
                return;
            }
            if (ev.key === 'Escape') {
                var inp = document.getElementById('messageInput');
                inp.value = '';
                promptIdx = promptHistory.length;
                promptDraft = '';
                inp.blur();
                return;
            }
            if (ev.key === 'ArrowUp') {
                if (promptHistory.length === 0) return;
                if (promptIdx === promptHistory.length) {
                    promptDraft = document.getElementById('messageInput').value;
                    promptIdx = promptHistory.length - 1;
                } else if (promptIdx > 0) {
                    promptIdx--;
                } else {
                    return;
                }
                document.getElementById('messageInput').value = promptHistory[promptIdx];
                ev.preventDefault();
            } else if (ev.key === 'ArrowDown') {
                if (promptIdx >= promptHistory.length) return;
                promptIdx++;
                var inp = document.getElementById('messageInput');
                inp.value = (promptIdx === promptHistory.length) ? promptDraft : promptHistory[promptIdx];
                ev.preventDefault();
            }
        });

        // Show slash menu on input change (handles backspace, paste, selection)
        document.getElementById('messageInput').addEventListener('input', function() {
            showSlashMenu();
        });

        // Clicking anywhere outside the palette closes it.
        document.addEventListener('click', function(ev) {
            if (!slashMenuVisible) return;
            if (!ev.target.closest('.slash-menu') && !ev.target.closest('#messageInput')) {
                hideSlashMenu();
            }
        });

        function currentTheme() {
            var t = localStorage.getItem('pbx-theme');
            if (t === 'dark' || t === 'light') return t;
            return document.body.getAttribute('data-theme') || 'light';
        }
        function toggleLang() {
            var next = document.documentElement.lang === 'cs' ? 'en' : 'cs';
            var d = new Date(); d.setTime(d.getTime() + 365*24*3600*1000);
            document.cookie = 'pb_lang=' + next + ';path=/;expires=' + d.toUTCString();
            fetch('/api/lang/' + next, { method: 'POST' }).catch(function(){});
            window.location.reload();
        }
        function applyTheme(mode) {
            document.body.setAttribute('data-theme', mode);
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            var next = currentTheme() === 'dark' ? 'light' : 'dark';
            localStorage.setItem('pbx-theme', next);
            applyTheme(next);
            fetch('/api/theme/' + next, { method: 'POST' }).catch(function(){});
        }
        applyTheme(currentTheme());
        document.addEventListener('DOMContentLoaded', function() { loadConversations(); loadSuggestions(); });
    </script>
</body>
</html>
