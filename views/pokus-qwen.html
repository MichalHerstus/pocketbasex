<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage with Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .topbar {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }
        .sidebar {
            width: 250px;
            height: calc(100vh - 60px);
            background-color: #f4f4f9;
            float: left;
            padding: 20px;
        }
        .content {
            margin-left: 270px;
            padding: 20px;
        }
        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .table-container {
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .pagination {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="topbar">
    Top Bar
</div>

<div class="sidebar">
    <h2>Navigation Sidebar</h2>
    <ul>
        <li><a href="#">Link 1</a></li>
        <li><a href="#">Link 2</a></li>
        <li><a href="#">Link 3</a></li>
        <li><a href="#">Link 4</a></li>
    </ul>
</div>

<div class="content">
    <h2>Table Content</h2>

    <input type="text" id="searchInput" placeholder="Search...">
    
    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Country</th>
                </tr>
            </thead>
            <tbody>
                <!-- Row 1 -->
                <tr>
                    <td>1</td>
                    <td>Alice Johnson</td>
                    <td>28</td>
                    <td>alice@example.com</td>
                    <td>USA</td>
                </tr>
                <!-- Row 2 -->
                <tr>
                    <td>2</td>
                    <td>Bob Smith</td>
                    <td>34</td>
                    <td>bob@example.com</td>
                    <td>Canada</td>
                </tr>
                <!-- Add more rows as needed -->
            </tbody>
        </table>

        <div class="pagination">
            <button onclick="prevPage()">Previous</button>
            <button onclick="nextPage()">Next</button>
        </div>
    </div>
</div>

<div class="footer">
    Copyright © White Dog Software 2026
</div>

<script>
    const rowsPerPage = 5;
    let currentPage = 1;

    function showTablePage(page) {
        const table = document.getElementById('dataTable');
        const rows = Array.from(table.rows).slice(1); // Exclude header row
        const startIndex = (page - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;

        rows.forEach((row, index) => {
            if (index >= startIndex && index < endIndex) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            showTablePage(currentPage);
        }
    }

    function nextPage() {
        const table = document.getElementById('dataTable');
        const rows = Array.from(table.rows).slice(1); // Exclude header row
        if (currentPage < Math.ceil(rows.length / rowsPerPage)) {
            currentPage++;
            showTablePage(currentPage);
        }
    }

    // Initial table display
    showTablePage(currentPage);

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', function () {
        const searchValue = this.value.toLowerCase();
        const table = document.getElementById('dataTable');
        const rows = Array.from(table.rows).slice(1); // Exclude header row

        rows.forEach(row => {
            const cells = Array.from(row.cells);
            if (cells.some(cell => cell.textContent.toLowerCase().includes(searchValue))) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });

        // Reset pagination
        currentPage = 1;
        showTablePage(currentPage);
    });
</script>

</body>
</html>
