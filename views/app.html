<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background: var(--body-bg, #f5f5f5); color: #333; }
        h1 { margin: 0 0 4px 0; font-size: 1.8rem; }
        .subtitle { margin: 0 0 12px 0; font-size: .95rem; color: #666; }
        .user-bar { margin-bottom: 20px; padding: 12px 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; justify-content: space-between; align-items: center; font-size: .9rem; }
        .user-bar .name { font-weight: 600; color: #007bff; }
        .user-bar .signin { color: #888; }
        .user-bar a { color: #007bff; text-decoration: none; }
        .user-bar a:hover { text-decoration: underline; }
        .group-card { background: #fff; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; }
        .group-header { padding: 12px 16px; font-weight: 600; font-size: .95rem; color: #444; border-bottom: 1px solid #eee; background: #fafafa; }
        .group-links { list-style: none; margin: 0; padding: 0; }
        .group-links li { border-bottom: 1px solid #f5f5f5; }
        .group-links li:last-child { border-bottom: none; }
        .group-links a { display: block; padding: 10px 16px; color: #007bff; text-decoration: none; font-size: .9rem; transition: background .15s; }
        .group-links a:hover { background: #f0f7ff; }
        .copyright { margin-top: 32px; font-size: .85rem; color: #888; }
    </style>
</head>
<body>
    <h1>Pocketbase Extended</h1>
    <p class="subtitle">application server with web user interface</p>

    {{if .Error}}
    <div class="user-bar">
        <span class="signin">Please sign in</span>
        <a href="/login">Sign in</a>
    </div>
    {{else}}
    <div class="user-bar">
        <span>Signed in as <span class="name">{{.Name}}</span></span>
        <a href="/login">Sign out</a>
    </div>
    {{end}}

    {{range .Groups}}
    <div class="group-card">
        <div class="group-header">{{.GroupLabel}}</div>
        <ul class="group-links">
            {{range .Links}}
            <li><a href="/tabulator/{{.Collection}}">{{.Label}}</a></li>
            {{end}}
        </ul>
    </div>
    {{end}}

    <p class="copyright"><i>(c)POINT.X 2026, MH</i></p>
</body>
</html>
