<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PBX Home</title>
    <link rel="stylesheet" href="assets/w3.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f9fb;
        display: flex;
        min-height: 100vh;
      }
      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 56px;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 100;
      }
      .topbar-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #222;
      }
      .topbar-user {
        font-size: 0.9rem;
        color: #555;
      }
      .sidebar {
        position: fixed;
        top: 56px; left: 0; bottom: 0;
        width: 220px;
        background: #fff;
        border-right: 1px solid #e0e0e0;
        padding: 16px 0;
        overflow-y: auto;
      }
      .sidebar-item {
        display: block;
        width: 100%;
        padding: 12px 24px;
        border: none;
        background: none;
        text-align: left;
        font-size: 0.95rem;
        color: #333;
        cursor: pointer;
      }
      .sidebar-item:hover {
        background: #f0f0f0;
      }
      .sidebar-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .sidebar-nav {
        flex: 1;
      }
      .sidebar-item.logout {
        color: #c00;
      }
      .main {
        margin-left: 220px;
        margin-top: 56px;
        flex: 1;
        padding: 32px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const pb = new PocketBase('http://127.0.0.1:8090');

      function HomePage() {
        const [user, setUser] = useState(null);

        useEffect(() => {
          if (!pb.authStore.model) {
            window.location.replace('rlogin.html');
            return;
          }
          setUser(pb.authStore.model);
        }, []);

        const handleLogout = () => {
          pb.authStore.clear();
          window.location.replace('rlogin.html');
        };

        if (!user) return null;

        return (
          <>
            <div className="topbar">
              <span className="topbar-title">PX Assets</span>
              <span className="topbar-user">{user.name || user.email}</span>
            </div>
            <div className="sidebar">
              <div className="sidebar-inner">
                <div className="sidebar-nav">
                  <button className="sidebar-item">Assets</button>
                  <button className="sidebar-item">Counting</button>
                  <button className="sidebar-item">Setup</button>
                </div>
                <button className="sidebar-item logout" onClick={handleLogout}>Logout</button>
              </div>
            </div>
            <div className="main"></div>
          </>
        );
      }

      const rootElement = document.getElementById('root');
      ReactDOM.createRoot(rootElement).render(React.createElement(HomePage));
    </script>
  </body>
</html>
